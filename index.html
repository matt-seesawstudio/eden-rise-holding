<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eden Rise Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<style>
/* Layout: full-bleed photo; two blocks across the bottom (multiplied charcoal | Pask orange).
   Scrolling (or "Discover more") grows the orange block until it fills the screen. */
:root {
  --orange: #F57221;
  --charcoal: #444444;
  --ink: #111111;
  --white: #FFFFFF;
  --cream: #FFF1E6;
  --font: "Aeonik", "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-label: "Scto Grotesk A", "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --gutter: max(16px, 2vw);
  --band-h: clamp(150px, 10.75vw, 260px);
  /* Lockup sizes: headline / Eden Rise, and the line locked beneath each */
  --hs: clamp(32px, 4.45vw, 108px);
  --ss-d: clamp(12px, 1.15vw, 28px);
  --ss-v: calc(var(--hs) * .46);
  /* Lockup geometry, as fractions of --hs (from the 1920 artboard: baseline 99px from block top, 69px baseline to baseline) */
  --lk-top: .309;
  --lk-gap: .81;
  --ease-wipe: cubic-bezier(.77, 0, .18, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
html { background: var(--ink); }
body { background: var(--ink); color: var(--white); font-family: var(--font); -webkit-font-smoothing: antialiased; }

.scroller { height: 210vh; height: 210svh; position: relative; }
.stage {
  position: sticky; top: 0;
  height: 100vh; height: 100svh;
  overflow: hidden;
}

/* Photo */
.photo { position: absolute; inset: 0; overflow: hidden; }
.photo img {
  width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 50% 30%;
  display: block;
  animation: photoIn 2.2s var(--ease-out) both;
  transform: scale(calc(1 + var(--p, 0) * .06));
}
@keyframes photoIn { from { opacity: 0; scale: 1.12; } to { opacity: 1; scale: 1; } }

/* Logo */
.logo {
  position: absolute; z-index: 6;
  top: calc(max(20px, 2.1vw) + env(safe-area-inset-top, 0px));
  right: max(var(--gutter), env(safe-area-inset-right, 0px));
  width: clamp(64px, 4.5vw, 110px);
  color: var(--white);
  animation: fadeIn 1s ease 1.6s both;
}
.logo svg { display: block; width: 100%; height: auto; }

/* Bands */
.band {
  position: absolute; bottom: 0; height: var(--band-h);
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 0;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.band--dark { left: 0; width: 50%; z-index: 2; }
.band-bg {
  position: absolute; left: 0; bottom: 0; width: 50%; height: var(--band-h);
  background: var(--charcoal); mix-blend-mode: multiply;
  animation: wipeFromLeft 1.1s var(--ease-wipe) .35s both;
}
.band--orange { right: 0; width: 50%; z-index: 4; align-items: flex-end; text-align: right; pointer-events: none; }

/* Orange fill: a full-screen layer clipped to the orange block, opened up by scroll */
.fill-wrap { position: absolute; inset: 0; z-index: 3; animation: wipeFromRight 1.1s var(--ease-wipe) .5s both; pointer-events: none; }
.fill {
  position: absolute; inset: 0; background: var(--orange);
  clip-path: inset(var(--ct, 80%) var(--cr, 0px) var(--cb, 0px) var(--cl, 50%));
  will-change: clip-path;
}
@keyframes wipeFromLeft { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes wipeFromRight { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Type */
.headline, .eden {
  margin: 0; font-weight: 500;
  font-size: var(--hs);
  line-height: 1; letter-spacing: -0.02em;
}
.village {
  font-family: var(--font-label); font-weight: 500;
  font-size: var(--ss-v); line-height: 1; letter-spacing: 0.01em;
  display: block; margin-top: calc(var(--hs) * (var(--lk-gap) - .15) - var(--ss-v) * .85);
}
.mask { display: block; overflow: hidden; padding-bottom: .12em; margin-bottom: -.12em; }
.mask > span { display: inline-block; animation: rise 1.15s var(--ease-out) both; }
.d1 { animation-delay: 1.0s !important; }
.d2 { animation-delay: 1.12s !important; }
.d3 { animation-delay: 1.3s !important; }
.d4 { animation-delay: 1.5s !important; }
@keyframes rise { from { transform: translateY(110%); } to { transform: translateY(0); } }

.band--orange .copy { transform: translateY(calc(var(--p, 0) * -40px)); opacity: calc(1 - var(--p, 0) * 3); }
.band--dark .copy { opacity: calc(1 - var(--p, 0) * 2.2); }
.copy { display: flex; flex-direction: column; justify-content: flex-start; gap: 0; padding-top: calc(var(--hs) * var(--lk-top)); }
.band--orange .copy { align-items: flex-end; }
.band--dark .discover { margin-top: calc(var(--hs) * (var(--lk-gap) - .15) - var(--ss-d) * .85); }

/* Discover more */
.discover {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: .55em;
  font-family: var(--font-label); font-weight: 500; text-transform: uppercase;
  font-size: var(--ss-d); letter-spacing: 0.02em; line-height: 1;
  color: var(--orange); text-decoration: none;
  position: relative; padding-block: 0; cursor: pointer;
  background: none; border: 0; padding-inline: 0;
  pointer-events: auto;
}
.discover::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -.35em; height: 2px;
  background: currentColor; transform: scaleX(0); transform-origin: right;
  transition: transform .55s var(--ease-out);
}
.discover .arrow { display: inline-block; width: .8em; height: .8em; transition: transform .5s var(--ease-out); }
.discover:hover::after, .discover:focus-visible::after { transform: scaleX(1); transform-origin: left; }
.discover:hover .arrow, .discover:focus-visible .arrow { animation: nudge 1.1s var(--ease-out) infinite; }
.discover:hover, .discover:focus-visible { color: var(--white); }
.discover { transition: color .35s ease; }
.discover:focus-visible { outline: 2px solid var(--orange); outline-offset: 6px; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(35%); } }

/* Full orange page */
.page {
  position: absolute; inset: 0; z-index: 5;
  display: grid; grid-template-rows: 1fr auto;
  padding-block: calc(max(20px, 2.1vw) + env(safe-area-inset-top, 0px)) calc(clamp(20px, 2vw, 44px) + env(safe-area-inset-bottom, 0px));
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  color: var(--white);
  opacity: var(--po, 0);
  visibility: hidden;
  pointer-events: none;
}
.page.is-on { visibility: visible; pointer-events: auto; }
.page__main { align-self: center; display: grid; gap: clamp(16px, 2vw, 40px); max-width: 1400px; }
.page__main > * { transform: translateY(calc((1 - var(--po, 0)) * 40px)); }
.eyebrow { font-family: var(--font-label); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; font-size: clamp(12px, 1.05vw, 22px); color: var(--ink); }
.page h2 {
  margin: 0; font-weight: 500; line-height: .98; letter-spacing: -0.03em;
  font-size: clamp(44px, 8.4vw, 200px); text-wrap: balance;
}
.page p { margin: 0; max-width: 34ch; font-size: clamp(17px, 1.6vw, 34px); line-height: 1.3; letter-spacing: -0.01em; color: var(--cream); text-wrap: pretty; }
.page__foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page__foot .discover { color: var(--white); }
.page__foot .discover:hover, .page__foot .discover:focus-visible { color: var(--ink); }
.page__foot .discover:focus-visible { outline-color: var(--white); }
.page__foot .discover .arrow { transform: rotate(180deg); }
.page__foot .discover:hover .arrow, .page__foot .discover:focus-visible .arrow { animation: nudgeUp 1.1s var(--ease-out) infinite; }
@keyframes nudgeUp { 0%, 100% { transform: rotate(180deg) translateY(0); } 45% { transform: rotate(180deg) translateY(35%); } }
.page__logo { width: clamp(64px, 4.5vw, 110px); color: var(--white); }
.page__logo svg { display: block; width: 100%; height: auto; }

/* Phone: stack the two blocks */
@media (max-width: 720px) {
  :root { --band-h: auto; }
  :root { --hs: 36px; --ss-d: 13px; }
  .band { width: 100%; }
  .band--orange { bottom: 0; height: 104px; }
  .band--dark { bottom: 104px; height: 104px; }
  .band-bg { width: 100%; bottom: 104px; height: 104px; }
  .photo img { object-position: 30% 30%; }
}

@media (prefers-reduced-motion: reduce) {
  .photo img, .logo, .band-bg, .fill-wrap, .mask > span { animation: none !important; }
  .discover:hover .arrow, .discover:focus-visible .arrow, .page__foot .discover:hover .arrow { animation: none !important; }
}
</style>
</head>

<script>
(() => {
  const root = document.documentElement;
  const scroller = document.getElementById('scroller');
  const stage = document.getElementById('stage');
  const band = document.getElementById('orangeBand');
  const fill = document.getElementById('fill');
  const page = document.getElementById('more');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let peek = 0, peekTarget = 0, rect = null;

  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));

  function measure() {
    // Measure the orange block relative to the stage, ignoring its scroll transform
    const s = stage.getBoundingClientRect();
    const r = band.getBoundingClientRect();
    rect = { t: r.top - s.top, l: r.left - s.left, r: s.right - r.right, b: s.bottom - r.bottom };
  }

  function progress() {
    const max = scroller.offsetHeight - stage.offsetHeight;
    return max > 0 ? clamp(window.scrollY / max) : 0;
  }

  function render() {
    if (!rect) measure();
    peek += (peekTarget - peek) * .18;
    const p = progress();
    const e = ease(p);
    const k = 1 - e;
    fill.style.setProperty('--ct', Math.max(0, rect.t * k - peek * k) + 'px');
    fill.style.setProperty('--cl', rect.l * k + 'px');
    fill.style.setProperty('--cr', rect.r * k + 'px');
    fill.style.setProperty('--cb', rect.b * k + 'px');
    root.style.setProperty('--p', p.toFixed(4));
    const po = clamp((p - .62) / .33);
    root.style.setProperty('--po', po.toFixed(4));
    const on = po > .02;
    page.classList.toggle('is-on', on);
    page.setAttribute('aria-hidden', on ? 'false' : 'true');
    if (Math.abs(peekTarget - peek) > .2) requestAnimationFrame(render);
  }

  // Smooth eased scroll for the buttons
  let anim = null;
  function scrollToY(y, dur = 1500) {
    if (reduce) { window.scrollTo(0, y); return; }
    cancelAnimationFrame(anim);
    const start = window.scrollY, dist = y - start, t0 = performance.now();
    const step = now => {
      const t = clamp((now - t0) / dur);
      window.scrollTo(0, start + dist * ease(t));
      if (t < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  const discover = document.getElementById('discover');
  discover.addEventListener('click', e => {
    e.preventDefault();
    peekTarget = 0;
    scrollToY(scroller.offsetHeight - stage.offsetHeight);
  });
  document.getElementById('backUp').addEventListener('click', e => {
    e.preventDefault();
    scrollToY(0, 1300);
    discover.focus({ preventScroll: true });
  });

  // Roll-over: the orange block lifts slightly as a hint of what's below
  const setPeek = v => { if (reduce || progress() > .02) return; peekTarget = v; requestAnimationFrame(render); };
  discover.addEventListener('mouseenter', () => setPeek(Math.min(28, innerHeight * .03)));
  discover.addEventListener('mouseleave', () => setPeek(0));
  discover.addEventListener('focus', () => setPeek(Math.min(28, innerHeight * .03)));
  discover.addEventListener('blur', () => setPeek(0));

  window.addEventListener('scroll', () => requestAnimationFrame(render), { passive: true });
  window.addEventListener('resize', () => { rect = null; requestAnimationFrame(render); });
  if (document.fonts) document.fonts.ready.then(() => { rect = null; render(); });
  render();
})();
</script>
